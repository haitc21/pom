apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holmesgpt
  namespace: holmesgpt
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: holmesgpt.k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holmesgpt-holmes
                port:
                  number: 80
