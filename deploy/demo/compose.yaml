name: aic-demo

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - aic_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aic]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - aic_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aic]
    restart: unless-stopped

  holmesgpt:
    image: ${HOLMES_IMAGE:-robustadev/holmes:0.39.0}
    environment:
      CLUSTER_NAME: ${K8S_CLUSTER_NAME:-k8s-poc}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      HOLMES_API_KEY: ${HOLMES_API_KEY:-aic-demo-local-holmes-key}
      HOLMES_APPROVAL_TTL_SECONDS: ${HOLMES_APPROVAL_TTL_SECONDS:-900}
      CUSTOM_TOOLSET_LOCATION: ${HOLMES_TOOLSET_CONFIG:-/etc/holmes/config/custom_toolset.yaml}
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      OVERRIDE_MAX_CONTENT_SIZE: "200000"
      OVERRIDE_MAX_OUTPUT_TOKEN: "64000"
      NO_PROXY: ".svc,.svc.cluster.local,10.96.0.0/12,10.244.0.0/16,10.77.0.0/24,llmpipe.vnpost.vn"
    volumes:
      - ${KUBECONFIG_PATH:-./holmesgpt/kubeconfig}:/root/.kube/config:ro
      - ./holmesgpt/model_list.yaml:/etc/holmes/config/model_list.yaml:ro
      - ./holmesgpt/custom_toolset.yaml:/etc/holmes/config/custom_toolset.yaml:ro
      - ./holmesgpt/remediation-toolset.yaml:/etc/holmes/config/remediation-toolset.yaml:ro
    entrypoint: ["python3"]
    command: ["-u", "server.py"]
    expose: ["5050"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/healthz', timeout=3)\" "]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [aic]
    restart: unless-stopped

  aic-api:
    build:
      context: ./aic-api
    environment:
      AIC_PORT: "8080"
      AIC_MODEL: ${AIC_MODEL:-mistral-3.5}
      AIC_LOG_LEVEL: ${AIC_LOG_LEVEL:-INFO}
      AIC_MAX_ITERATIONS: ${AIC_MAX_ITERATIONS:-20}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MEM0_COLLECTION: ${MEM0_COLLECTION:-aic_incident_memory}
      MEM0_EMBEDDING_MODEL: ${MEM0_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-384}
      HOLMES_URL: ${HOLMES_URL:-http://holmesgpt:5050}
      HOLMES_API_KEY: ${HOLMES_API_KEY:-aic-demo-local-holmes-key}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
    volumes:
      - ./scripts/seed-approved-resolution.py:/opt/aic/seed-approved-resolution.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      holmesgpt:
        condition: service_healthy
    ports:
      - "${AIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\" "]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aic]
    restart: unless-stopped

networks:
  aic:
    driver: bridge

volumes:
  # PostgreSQL 16 volume is intentionally retained separately for rollback.
  aic_postgres18_data:
  aic_qdrant_data:
