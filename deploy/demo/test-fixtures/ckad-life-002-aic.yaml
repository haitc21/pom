apiVersion: v1
kind: Namespace
metadata:
  name: holmes-eval-ckad-life-002-aic
  labels:
    aic.poc/test-case: CKAD-LIFE-002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckad-life-002
  namespace: holmes-eval-ckad-life-002-aic
  labels:
    app: ckad-life-002
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ckad-life-002
  template:
    metadata:
      labels:
        app: ckad-life-002
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s03
      containers:
        - name: nginx
          image: docker.io/library/nginx:99.99.99-postops-invalid
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ckad-life-002
  namespace: holmes-eval-ckad-life-002-aic
spec:
  selector:
    app: ckad-life-002
  ports:
    - name: http
      port: 80
      targetPort: http
