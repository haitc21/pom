apiVersion: v1
kind: Namespace
metadata:
  name: holmes-eval-ckad-life-001-aic
  labels:
    aic.test.case: CKAD-LIFE-001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckad-life-001
  namespace: holmes-eval-ckad-life-001-aic
  labels:
    app: ckad-life-001
    aic.test.case: CKAD-LIFE-001
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ckad-life-001
  template:
    metadata:
      labels:
        app: ckad-life-001
        aic.test.case: CKAD-LIFE-001
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - "echo 'fatal: configuration file /etc/demo/app.yaml not found' >&2; exit 1"
          ports:
            - name: http
              containerPort: 80
