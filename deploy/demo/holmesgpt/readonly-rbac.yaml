apiVersion: v1
kind: ServiceAccount
metadata:
  name: holmesgpt-readonly
  namespace: holmesgpt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: holmesgpt-readonly
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io", "policy", "storage.k8s.io"]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps", "events", "nodes", "namespaces", "deployments", "replicasets", "statefulsets", "daemonsets", "jobs", "cronjobs", "horizontalpodautoscalers", "ingresses", "networkpolicies", "persistentvolumes", "persistentvolumeclaims", "storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: holmesgpt-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: holmesgpt-readonly
subjects:
  - kind: ServiceAccount
    name: holmesgpt-readonly
    namespace: holmesgpt
