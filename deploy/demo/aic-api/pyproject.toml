[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aic-api"
version = "0.1.0"
description = "AI Incident Copilot demo API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "fastembed==0.8.0",
  "httpx==0.28.1",
  "mem0ai==2.0.18",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "qdrant-client==1.19.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aic"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["aic"]

