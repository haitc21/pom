apiVersion: v1
kind: Namespace
metadata:
  name: holmes-eval-ckad-life-004-run-a
  labels: {postops.poc/test: "true", postops.poc/case-id: CKAD-LIFE-004, postops.poc/run-id: run-a-holmesgpt}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckad-life-004
  namespace: holmes-eval-ckad-life-004-run-a
  labels: {postops.poc/test: "true", postops.poc/case-id: CKAD-LIFE-004}
spec:
  replicas: 1
  selector: {matchLabels: {app: ckad-life-004}}
  template:
    metadata: {labels: {app: ckad-life-004, postops.poc/test: "true", postops.poc/case-id: CKAD-LIFE-004}}
    spec:
      nodeSelector: {kubernetes.io/hostname: k8s03}
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 80}]
          livenessProbe:
            httpGet: {path: /wrong-live, port: http}
            periodSeconds: 5
            failureThreshold: 2
