apiVersion: v1
kind: Namespace
metadata:
  name: holmes-eval-ckad-life-005-run-a
  labels: {postops.poc/test: "true", postops.poc/case-id: CKAD-LIFE-005, postops.poc/run-id: run-a-holmesgpt}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckad-life-005
  namespace: holmes-eval-ckad-life-005-run-a
  labels: {postops.poc/test: "true", postops.poc/case-id: CKAD-LIFE-005}
spec:
  replicas: 1
  selector: {matchLabels: {app: ckad-life-005}}
  template:
    metadata: {labels: {app: ckad-life-005, postops.poc/test: "true", postops.poc/case-id: CKAD-LIFE-005}}
    spec:
      nodeSelector: {kubernetes.io/hostname: k8s03}
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["awk 'BEGIN { s=\"x\"; for (i=0; i<24; i++) s=s s s s s s s s; print length(s); system(\"sleep 300\") }'"]
          resources:
            requests: {memory: 16Mi}
            limits: {memory: 16Mi}
